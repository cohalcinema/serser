<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayor o menor | Serser</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .mm-intro {
            width: 900px; max-width: 90%;
            margin: .5rem auto 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: .9rem;
        }
        .mm-racha {
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: .1em;
            color: var(--accent);
            margin-bottom: 1.2rem;
        }
        .mm-racha .mejor {
            display: block;
            font-family: 'Nunito', sans-serif;
            font-size: .75rem;
            color: var(--text-muted);
            letter-spacing: .05em;
            margin-top: .1rem;
        }

        .mm-duelo {
            width: 620px; max-width: 92%;
            margin: 0 auto 1.4rem;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1rem;
        }
        .mm-vs {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            color: var(--text-muted);
        }
        .mm-carta {
            display: flex; flex-direction: column; align-items: center; gap: .5rem;
        }
        .mm-poster-wrap {
            width: 180px;
            aspect-ratio: 2/3;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            background: var(--bg-card);
            box-shadow: 0 0 0 1px rgba(255,255,255,.2);
            transition: box-shadow .25s ease;
        }
        .mm-poster-wrap img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .mm-poster-skeleton {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .mm-carta.correcta .mm-poster-wrap  { box-shadow: 0 0 0 3px var(--accent); }
        .mm-carta.incorrecta .mm-poster-wrap { box-shadow: 0 0 0 3px #e05a5a; }

        .mm-nombre {
            font-size: .85rem; font-weight: 700; text-align: center; min-height: 1.3em;
        }
        .mm-punt {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem; letter-spacing: .08em;
            color: var(--accent);
            min-height: 1.4rem;
        }
        .mm-punt.oculto { color: var(--text-muted); font-size: 1.8rem; }

        .mm-botones {
            width: 620px; max-width: 92%;
            margin: 0 auto 1.2rem;
            display: flex; gap: 1rem;
        }
        .mm-botones button {
            flex: 1;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem; letter-spacing: .1em;
            cursor: pointer; transition: var(--tr);
        }
        .mm-botones button:hover:not(:disabled) {
            border-color: var(--accent); color: var(--accent); background: var(--bg-hover);
        }
        .mm-botones button:disabled { opacity: .4; cursor: not-allowed; }

        .mm-mensaje {
            width: 620px; max-width: 92%;
            margin: 0 auto 1rem;
            text-align: center;
            font-size: .9rem;
            color: var(--text-muted);
            min-height: 1.3em;
        }

        .mm-gameover {
            width: 620px; max-width: 92%;
            margin: 1.5rem auto;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .mm-gameover.visible { display: flex; }
        .mm-gameover h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem; letter-spacing: .1em;
            color: #e05a5a;
        }
        .mm-gameover p { color: var(--text-muted); }
        .btn-reintentar {
            padding: .9rem 2rem;
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            border-radius: var(--radius);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem; letter-spacing: .1em;
            cursor: pointer; transition: var(--tr);
        }
        .btn-reintentar:hover { background: var(--accent-h); scale: .97; }

        @media (max-width: 480px) {
            .mm-poster-wrap { width: 130px; }
            .mm-duelo { gap: .5rem; }
        }
    </style>
</head>
<body>
    <div class="btn-titulo"><a href="index.html">⚖️ Mayor o menor</a></div>
    <p class="mm-intro">
        Se te enseña una serie con su nota. Adivina si la siguiente la puntuaste más alto o más bajo.
        Encadena aciertos para subir la racha — un fallo y se acaba.
    </p>

    <div class="mm-racha">
        <span id="racha-num">Racha: 0</span>
        <span class="mejor" id="mejor-racha"></span>
    </div>

    <div class="mm-duelo" id="duelo">
        <div class="mm-carta" id="carta-izq">
            <div class="mm-poster-wrap"><div class="mm-poster-skeleton"></div><img id="img-izq" alt="" style="opacity:0;"></div>
            <div class="mm-nombre" id="nombre-izq"></div>
            <div class="mm-punt" id="punt-izq"></div>
        </div>
        <div class="mm-vs">VS</div>
        <div class="mm-carta" id="carta-der">
            <div class="mm-poster-wrap"><div class="mm-poster-skeleton"></div><img id="img-der" alt="" style="opacity:0;"></div>
            <div class="mm-nombre" id="nombre-der"></div>
            <div class="mm-punt oculto" id="punt-der">?</div>
        </div>
    </div>

    <div class="mm-botones">
        <button id="btn-mayor">▲ Más alta</button>
        <button id="btn-menor">▼ Más baja</button>
    </div>

    <div class="mm-mensaje" id="mensaje"></div>

    <div class="mm-gameover" id="gameover">
        <h2>Fin de la partida</h2>
        <p id="gameover-texto"></p>
        <button class="btn-reintentar" id="btn-reintentar">Jugar de nuevo</button>
    </div>

    <div class="btn-volver"><a href="index.html">Menú</a></div>

    <script>
        const DECADAS = ['1980','1990','2000','2010','2020'];

        let _todas   = [];
        let _izq = null, _der = null;
        let _racha = 0;
        let _mejorRacha = 0;
        let _bloqueado = false;

        function cargarImg(imgEl, skelEl, src) {
            imgEl.style.opacity = '0';
            skelEl.style.display = 'block';
            if (!src) { skelEl.style.display = 'none'; return; }
            const tmp = new Image();
            tmp.onload  = () => { imgEl.src = src; skelEl.style.display = 'none'; imgEl.style.opacity = '1'; };
            tmp.onerror = () => { skelEl.style.display = 'none'; };
            tmp.src = src;
        }

        function otraPelicula(excluir) {
            let p;
            do { p = _todas[Math.floor(Math.random() * _todas.length)]; }
            while (_todas.length > 1 && excluir.includes(p));
            return p;
        }

        function actualizarRacha() {
            document.getElementById('racha-num').textContent = `Racha: ${_racha}`;
            document.getElementById('mejor-racha').textContent =
                _mejorRacha > 0 ? `Mejor racha de esta sesión: ${_mejorRacha}` : '';
        }

        function pintarDuelo() {
            document.getElementById('carta-izq').classList.remove('correcta', 'incorrecta');
            document.getElementById('carta-der').classList.remove('correcta', 'incorrecta');
            document.getElementById('nombre-izq').textContent = _izq.tit || '';
            document.getElementById('nombre-der').textContent = _der.tit || '';
            document.getElementById('punt-izq').textContent = _izq.punt;
            document.getElementById('punt-izq').className = 'mm-punt';
            document.getElementById('punt-der').textContent = '?';
            document.getElementById('punt-der').className = 'mm-punt oculto';
            cargarImg(document.getElementById('img-izq'), document.querySelector('#carta-izq .mm-poster-skeleton'), _izq.img);
            cargarImg(document.getElementById('img-der'), document.querySelector('#carta-der .mm-poster-skeleton'), _der.img);
            document.getElementById('mensaje').textContent = '';
            _bloqueado = false;
            document.getElementById('btn-mayor').disabled = false;
            document.getElementById('btn-menor').disabled = false;
        }

        function nuevaRonda(mantenerIzq) {
            _izq = mantenerIzq || _todas[Math.floor(Math.random() * _todas.length)];
            _der = otraPelicula([_izq]);
            pintarDuelo();
        }

        function guardar(guess) {
            if (_bloqueado) return;
            _bloqueado = true;
            document.getElementById('btn-mayor').disabled = true;
            document.getElementById('btn-menor').disabled = true;

            const real = _der.punt >= _izq.punt ? 'mayor' : 'menor';
            const empate = _der.punt === _izq.punt;
            const acierto = empate || guess === real;

            document.getElementById('punt-der').textContent = _der.punt;
            document.getElementById('punt-der').className = 'mm-punt';

            if (acierto) {
                _racha++;
                _mejorRacha = Math.max(_mejorRacha, _racha);
                document.getElementById('carta-der').classList.add('correcta');
                document.getElementById('mensaje').textContent =
                    empate ? '¡Empate, cuenta como acierto!' : '¡Acierto!';
                actualizarRacha();
                setTimeout(() => nuevaRonda(_der), 900);
            } else {
                document.getElementById('carta-der').classList.add('incorrecta');
                document.getElementById('mensaje').textContent = 'Fallo…';
                setTimeout(() => {
                    document.getElementById('duelo').style.opacity = '.3';
                    document.getElementById('gameover-texto').textContent =
                        `Has llegado a una racha de ${_racha}.`;
                    document.getElementById('gameover').classList.add('visible');
                    document.querySelector('.mm-botones').style.display = 'none';
                }, 700);
            }
        }

        document.getElementById('btn-mayor').addEventListener('click', () => guardar('mayor'));
        document.getElementById('btn-menor').addEventListener('click', () => guardar('menor'));
        document.getElementById('btn-reintentar').addEventListener('click', () => {
            _racha = 0;
            actualizarRacha();
            document.getElementById('duelo').style.opacity = '1';
            document.getElementById('gameover').classList.remove('visible');
            document.querySelector('.mm-botones').style.display = 'flex';
            nuevaRonda();
        });

        async function init() {
            const fetches = DECADAS.map(d =>
                fetch(`json/${d}.json`).then(r => r.json()).catch(() => []));
            _todas = (await Promise.all(fetches)).flat();
            actualizarRacha();
            nuevaRonda();
        }
        init();
    </script>
</body>
</html>
