<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué año es? | Serser</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .qa-intro {
            width: 620px; max-width: 90%;
            margin: .5rem auto 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: .9rem;
        }
        .qa-marcador {
            text-align: center;
            font-size: .82rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
        }
        .qa-marcador b { color: var(--accent); }

        .qa-wrap {
            width: 620px; max-width: 92%;
            margin: 0 auto 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .qa-poster-wrap {
            width: 200px;
            aspect-ratio: 2/3;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            background: var(--bg-card);
            box-shadow: 0 0 0 1px rgba(255,255,255,.2);
        }
        .qa-poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .qa-poster-skeleton {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .qa-nombre {
            font-size: .88rem; font-weight: 700; text-align: center; min-height: 1.3em;
        }

        .qa-slider-zona {
            width: 100%; max-width: 420px;
            display: flex; flex-direction: column; gap: .6rem;
        }
        .qa-slider-zona label {
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.7rem;
            letter-spacing: .08em;
            color: var(--text);
        }
        .qa-slider-zona input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-comprobar {
            padding: .9rem 2.2rem;
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            border-radius: var(--radius);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem; letter-spacing: .1em;
            cursor: pointer; transition: var(--tr);
        }
        .btn-comprobar:hover { background: var(--accent-h); scale: .97; }
        .btn-comprobar:disabled { opacity: .4; cursor: not-allowed; }

        .qa-resultado {
            text-align: center;
            font-size: 1rem;
            min-height: 1.4em;
        }
        .qa-resultado.bien   { color: var(--accent); }
        .qa-resultado.regular{ color: #e0c04a; }
        .qa-resultado.mal    { color: #e05a5a; }

        .btn-siguiente {
            display: none;
            padding: .8rem 1.8rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius);
            font-family: 'Nunito', sans-serif; font-weight: 700;
            font-size: .9rem;
            cursor: pointer; transition: var(--tr);
        }
        .btn-siguiente.visible { display: inline-block; }
        .btn-siguiente:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <div class="btn-titulo"><a href="index.html">🗓️ ¿Qué año es?</a></div>
    <p class="qa-intro">
        Se te enseña una serie tuya. Mueve el slider para adivinar el año de estreno y comprueba
        cuánto te acercas. Sin límite de rondas — juega tantas como quieras.
    </p>
    <div class="qa-marcador" id="marcador">Cargando…</div>

    <div class="qa-wrap">
        <div class="qa-poster-wrap"><div class="qa-poster-skeleton"></div><img id="poster-img" alt="" style="opacity:0;"></div>
        <div class="qa-nombre" id="nombre"></div>

        <div class="qa-slider-zona">
            <label id="valor-slider">2000</label>
            <input type="range" id="slider" min="1975" max="2026" step="1" value="2000">
        </div>

        <button class="btn-comprobar" id="btn-comprobar">Comprobar</button>
        <div class="qa-resultado" id="resultado"></div>
        <button class="btn-siguiente" id="btn-siguiente">Siguiente serie →</button>
    </div>

    <div class="btn-volver"><a href="index.html">Menú</a></div>

    <script>
        const DECADAS = ['1980','1990','2000','2010','2020'];

        let _todas    = [];
        let _actual   = null;
        let _rondas   = 0;
        let _puntos   = 0;
        let _resuelto = false;

        function actualizarMarcador() {
            document.getElementById('marcador').innerHTML =
                _rondas === 0
                    ? 'Todavía no has jugado ninguna ronda'
                    : `Ronda ${_rondas} · <b>${_puntos}</b> puntos en total`;
        }

        function cargarImg(src) {
            const img  = document.getElementById('poster-img');
            const skel = document.querySelector('.qa-poster-skeleton');
            img.style.opacity = '0';
            skel.style.display = 'block';
            if (!src) { skel.style.display = 'none'; return; }
            const tmp = new Image();
            tmp.onload  = () => { img.src = src; skel.style.display = 'none'; img.style.opacity = '1'; };
            tmp.onerror = () => { skel.style.display = 'none'; };
            tmp.src = src;
        }

        function nuevaRonda() {
            _actual   = _todas[Math.floor(Math.random() * _todas.length)];
            _resuelto = false;
            document.getElementById('nombre').textContent = _actual.tit || '';
            cargarImg(_actual.img);
            document.getElementById('slider').value = 2000;
            document.getElementById('valor-slider').textContent = 2000;
            document.getElementById('resultado').textContent = '';
            document.getElementById('resultado').className = 'qa-resultado';
            document.getElementById('btn-comprobar').disabled = false;
            document.getElementById('btn-siguiente').classList.remove('visible');
        }

        function comprobar() {
            if (_resuelto) return;
            _resuelto = true;
            document.getElementById('btn-comprobar').disabled = true;

            const guess = parseInt(document.getElementById('slider').value);
            const diff  = Math.abs(guess - _actual.anyo);
            const pts   = Math.max(0, 10 - diff);
            _puntos += pts;
            _rondas++;

            const res = document.getElementById('resultado');
            if (diff === 0) {
                res.textContent = `¡Exacto! Era ${_actual.anyo}. +${pts} puntos`;
                res.className = 'qa-resultado bien';
            } else if (diff <= 3) {
                res.textContent = `Muy cerca — era ${_actual.anyo} (te quedaste a ${diff} años). +${pts} puntos`;
                res.className = 'qa-resultado bien';
            } else if (diff <= 8) {
                res.textContent = `Cerca — era ${_actual.anyo} (te quedaste a ${diff} años). +${pts} puntos`;
                res.className = 'qa-resultado regular';
            } else {
                res.textContent = `Era ${_actual.anyo} — te quedaste a ${diff} años. +${pts} puntos`;
                res.className = 'qa-resultado mal';
            }

            actualizarMarcador();
            document.getElementById('btn-siguiente').classList.add('visible');
        }

        document.getElementById('slider').addEventListener('input', e => {
            document.getElementById('valor-slider').textContent = e.target.value;
        });
        document.getElementById('btn-comprobar').addEventListener('click', comprobar);
        document.getElementById('btn-siguiente').addEventListener('click', nuevaRonda);

        async function init() {
            const fetches = DECADAS.map(d =>
                fetch(`json/${d}.json`).then(r => r.json()).catch(() => []));
            _todas = (await Promise.all(fetches)).flat();
            actualizarMarcador();
            nuevaRonda();
        }
        init();
    </script>
</body>
</html>
